<h1>Add Money to Wallet</h1>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Add Money</button>
</form>

<p><a href="{% url 'home' %}">Back to Dashboard</a></p>
