
<h1>User Dashboard</h1>

<p>Welcome, {{ request.user.username }}!</p>

<hr>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<h2>Explore</h2>
<ul>
    <li><a href="{% url 'event_list' %}">Browse Events</a></li>
</ul>

<h2>My Account</h2>
<ul>
    <li><a href="{% url 'wallet_balance' %}">Wallet balance</a></li>
    <li> <a href="{% url 'my_bookings' %}">My Bookings</a></li>
    <li><a href="{% url 'transaction_history' %}">Transaction history</a></li>
    <li><a href="{% url 'add_money' %}">Add Money to Wallet</a></li>
</ul>

<hr>



<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Log Out</button>
</form>
